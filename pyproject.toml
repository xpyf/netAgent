[project]
name = "nolograph"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "neo4j>=6.3.0",
    "openai>=3.8.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netagent"]

[tool.pyright]
include = ["netagent", "scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]


